name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GA4 report test dependency
        run: python -m pip install -r scripts/requirements-ga4.txt

      - name: Test release validators and GA4 report
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      # Firebase config files are gitignored (they carry live keys), so CI
      # builds against placeholder config. Placeholder keys compile and run;
      # Firebase features stay inert. Signed release builds use real secrets
      # in release.yml instead.
      - name: Placeholder Firebase config
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.nandan.msritconnect"
                  }
                },
                "api_key": [{ "current_key": "PLACEHOLDER" }]
              }
            ]
          }
          EOF

      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build apk --debug

  # Vets the git history itself, not just the tree: any secret ever
  # committed fails the build, even if a later commit removes it.
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The Gitleaks GitHub Action requires a commercial license for
      # organization-owned repositories. Invoke the maintained OSS scanner
      # directly instead, so the complete checked-out history is still scanned.
      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/trufflesecurity/trufflehog:3.96.0 \
            git file:///repo \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown
