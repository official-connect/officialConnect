name: Release

# Tag a commit as v<version> (exactly the pubspec version, e.g. v1.1.7+16)
# and this pipeline verifies, signs, and publishes a GitHub Release with
# the AAB + APK attached. Manual runs default to a dry run (build only,
# artifacts on the workflow run) unless `publish` is set with a tag ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (else dry-run build only)"
        required: false
        default: false
        type: boolean
      tag:
        description: "Release tag for manual publish (e.g. v1.1.7+16)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GA4 report test dependency
        run: python -m pip install -r scripts/requirements-ga4.txt

      - name: Test release validators and GA4 report
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate release tag and intended commit
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF_TYPE: ${{ github.ref_type }}
          RELEASE_EVENT_REF_NAME: ${{ github.ref_name }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT_NAME" = "push" ] && [ "$RELEASE_EVENT_REF_TYPE" = "tag" ]; then
            release_tag="$RELEASE_EVENT_REF_NAME"
          elif [ "$RELEASE_PUBLISH" = "true" ]; then
            release_tag="$RELEASE_TAG_INPUT"
          else
            python scripts/validate_release_tag.py --dry-run --pubspec pubspec.yaml
            echo "RELEASE_TAG=dry-run" >> "$GITHUB_ENV"
            exit 0
          fi

          python scripts/validate_release_tag.py \
            --tag "$release_tag" \
            --pubspec pubspec.yaml \
            --expected-commit "$RELEASE_EXPECTED_COMMIT" \
            --fetch-tag
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      # Signing + Firebase material lives in GitHub Secrets (see
      # docs/RELEASE_SECRETS.md); nothing sensitive is in the repo.
      - name: Restore signing and Firebase config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

      - name: Signed release builds
        run: |
          APP_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          flutter build appbundle --release \
            --dart-define=OFFICIAL_CONNECT_DISTRIBUTION=production \
            --dart-define=APP_VERSION="$APP_VERSION"
          flutter build apk --release \
            --dart-define=OFFICIAL_CONNECT_DISTRIBUTION=production \
            --dart-define=APP_VERSION="$APP_VERSION"
          bash scripts/android_release_check.sh --check-artifact \
            build/app/outputs/bundle/release/app-release.aab
          bash scripts/android_release_check.sh --check-artifact \
            build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/officialconnect-${RELEASE_TAG}-app-release.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/officialconnect-${RELEASE_TAG}-app-release.apk"
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG" dist/*

      - name: Dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
